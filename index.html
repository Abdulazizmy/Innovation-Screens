<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Innovation Screen</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}body{position:relative}.stage{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center}.media{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:none;image-rendering:auto}.media.full{object-fit:cover}.media.contain{object-fit:contain}.media.cover{object-fit:cover}.media.background{object-fit:cover}.overlay{position:absolute;inset:0;background:rgba(0,0,0,.12);display:none;pointer-events:none}.message{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;color:#fff;background:#08070d;padding:30px}.message-box{max-width:700px}.message h1{font-size:38px;margin:0 0 12px}.message p{font-size:18px;color:#aaa;margin:0}.spinner{width:34px;height:34px;border:3px solid #333;border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;margin:auto}@keyframes spin{to{transform:rotate(360deg)}}#screenInfo{position:fixed;bottom:8px;left:8px;z-index:20;color:#777;font-size:10px;opacity:.35;direction:ltr}.offline{position:fixed;right:15px;bottom:15px;z-index:30;padding:7px 10px;border-radius:8px;background:#401b21;color:#ffdfe2;font-size:12px;display:none}.paused{position:fixed;top:15px;right:15px;z-index:30;padding:7px 10px;border-radius:8px;background:#201d2c;color:#fff;font-size:12px;display:none}
</style>
</head>
<body>
<div class="stage">
  <img id="image" class="media" alt="">
  <video id="video" class="media" playsinline preload="auto"></video>
  <div id="overlay" class="overlay"></div>
  <div id="maintenance" class="message"><div class="message-box"><h1>هذه الشاشة غير مفعلة</h1><p>يرجى تفعيل الشاشة من لوحة التحكم.</p></div></div>
  <div id="offline" class="offline">لا يوجد اتصال بالخادم</div>
  <div id="loading" class="message" style="display:flex"><div><div class="spinner"></div></div></div>
  <div id="screenInfo"></div>
</div>
<script>
const SUPABASE_URL="https://gkdqttzjwgyfyjbrcbdp.supabase.co";
const SUPABASE_KEY="sb_publishable_QRPg8bjUXtSxRtwBmCguug_cq8ZjbVv";
const STORAGE_BUCKET="signage-media";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const params=new URLSearchParams(location.search);
const SCREEN_ID=Number(params.get("id")||1);
const imageEl=document.getElementById("image");
const videoEl=document.getElementById("video");
const overlayEl=document.getElementById("overlay");
const maintenanceEl=document.getElementById("maintenance");
const offlineEl=document.getElementById("offline");
const loadingEl=document.getElementById("loading");
const screenInfoEl=document.getElementById("screenInfo");
let screen=null,currentItems=[],currentIndex=0,timer=null,paused=false,lastContentHash="",realtimeChannel=null,heartbeatTimer=null,firstLoad=true,syncTimer=null,syncInProgress=false;
let activePlaylist=null;
const CACHE_KEY="innovationSignageScreenCache_v4_"+SCREEN_ID;
function show(el,on=true){el.style.display=on?(el===imageEl||el===videoEl?"block":"flex"):"none"}
function clearTimer(){if(timer){clearTimeout(timer);timer=null}}
function setFit(mode){[imageEl,videoEl].forEach(e=>{e.classList.remove("cover","background","full","contain");if(mode==="cover"||mode==="fill")e.classList.add("full");else e.classList.add("contain")})}
function stopMedia(){clearTimer();videoEl.pause();videoEl.removeAttribute("src");imageEl.removeAttribute("src");show(imageEl,false);show(videoEl,false)}
function showMessage(text,sub=""){loadingEl.style.display="none";maintenanceEl.querySelector("h1").textContent=text;maintenanceEl.querySelector("p").textContent=sub;show(maintenanceEl,true);stopMedia()}
async function loadScreen(){const {data,error}=await supabaseClient.from("screens").select("*").eq("id",SCREEN_ID).maybeSingle();if(error)throw error;screen=data;screenInfoEl.textContent=`screen ${SCREEN_ID} · ${screen?.name||""}`;return data}
function checkScreen(){if(!screen){showMessage("الشاشة غير موجودة","تحقق من رقم الشاشة في الرابط.");return false}if(screen.enabled===false||screen.maintenance_mode===true){showMessage("هذه الشاشة غير مفعلة","يرجى تفعيل الشاشة من لوحة التحكم.");return false}show(maintenanceEl,false);return true}
async function loadPublishedContent(){
 const now=new Date();
 const today=now.toLocaleDateString("en-CA",{timeZone:"Asia/Riyadh"});
 const time=now.toLocaleTimeString("en-GB",{timeZone:"Asia/Riyadh",hour12:false,hour:"2-digit",minute:"2-digit"});
 let playlistId=null;
 const {data:scheduleRows,error:se}=await supabaseClient.from("schedules").select("*").eq("screen_id",SCREEN_ID).eq("enabled",true);
 if(!se){
  const active=(scheduleRows||[]).filter(r=>{const sd=String(r.start_date||"");const ed=String(r.end_date||r.start_date||"");if(today<sd||today>ed)return false;const st=String(r.start_time||"00:00").slice(0,5);const et=String(r.end_time||"23:59").slice(0,5);return st<=et?(time>=st&&time<=et):(time>=st||time<=et);}).sort((a,b)=>Number(b.priority||0)-Number(a.priority||0));
  if(active.length)playlistId=active[0].playlist_id;
 }
 if(!playlistId){const state=await supabaseClient.from("screen_publish_state").select("published_playlist_id,version,published_at").eq("screen_id",SCREEN_ID).maybeSingle();if(!state.error&&state.data?.published_playlist_id)playlistId=state.data.published_playlist_id;}
 if(!playlistId){const p=await supabaseClient.from("playlists").select("id").eq("screen_id",SCREEN_ID).eq("published",true).order("id",{ascending:false}).limit(1).maybeSingle();if(!p.error&&p.data)playlistId=p.data.id;}
 if(!playlistId){currentItems=[];activePlaylist=null;return {items:[],hash:"empty",playlist:null}}
 const {data:playlist,error:pe}=await supabaseClient.from("playlists").select("*").eq("id",playlistId).maybeSingle();if(pe)throw pe;
 const {data:items,error:ie}=await supabaseClient.from("playlist_items").select("*,media:media_id(*)").eq("playlist_id",playlistId).eq("enabled",true).order("position");if(ie)throw ie;
 const clean=(items||[]).filter(x=>x.media&&x.media.enabled!==false&&x.media.file_url);
 const hash=JSON.stringify({playlist:playlist?.id,updated:playlist?.updated_at,published:playlist?.published_at,items:clean.map(x=>({id:x.id,media:x.media_id,pos:x.position,d:x.duration,t:x.transition,u:x.media?.file_url}))});
 activePlaylist=playlist;return {items:clean,hash,playlist};
}

function saveCache(payload){try{localStorage.setItem(CACHE_KEY,JSON.stringify(payload))}catch(e){}}
function readCache(){try{const x=JSON.parse(localStorage.getItem(CACHE_KEY)||"null");return x}catch(e){return null}}
function applyItems(items,playlist){currentItems=items||[];currentIndex=0;setFit(playlist?.fit_mode||"contain");if(!currentItems.length){stopMedia();return}playCurrent()}
function playCurrent(){
 clearTimer();if(!currentItems.length)return;if(currentIndex>=currentItems.length)currentIndex=0;
 const item=currentItems[currentIndex],m=item.media||{};const type=m.type;
 show(imageEl,false);show(videoEl,false);overlayEl.style.display="none";videoEl.onended=null;videoEl.onerror=null;
 if(type==="image"){
   imageEl.src=m.file_url;show(imageEl,true);
   const duration=item.duration!==null&&item.duration!==undefined?Number(item.duration):0;
   if(duration>0)timer=setTimeout(nextItem,duration*1000);
 }else{
   videoEl.src=m.file_url;videoEl.currentTime=0;show(videoEl,true);
   videoEl.onended=()=>{if(playlistRepeat())nextItem();};videoEl.onerror=()=>{nextItem()};
   videoEl.play().catch(()=>{});
 }
}
function playlistRepeat(){return activePlaylist?.repeat_all!==false}
function nextItem(){clearTimer();if(!currentItems.length)return;currentIndex++;if(currentIndex>=currentItems.length){currentIndex=0}playCurrent()}
async function syncFromSupabase(){
 if(syncInProgress)return;
 syncInProgress=true;
 try{
  await loadScreen();
  if(!checkScreen())return;
  const result=await loadPublishedContent();
  offlineEl.style.display="none";
  if(firstLoad||result.hash!==lastContentHash){lastContentHash=result.hash;applyItems(result.items,result.playlist);saveCache({screen,items:result.items,playlist:result.playlist,hash:result.hash});firstLoad=false}
  sendHeartbeat();
  loadingEl.style.display="none";
 }catch(e){console.error(e);offlineEl.style.display="block";loadingEl.style.display="none";if(firstLoad){const c=readCache();if(c){screen=c.screen;currentItems=c.items||[];lastContentHash=c.hash||"";if(checkScreen()){applyItems(c.items,c.playlist);firstLoad=false}}else{showMessage("تعذر تحميل الشاشة","تحقق من الاتصال بالخادم ورقم الشاشة ثم أعد فتح الرابط.")}}}
 finally{syncInProgress=false;}
}
async function sendHeartbeat(){try{await supabaseClient.from("screen_heartbeats").upsert({screen_id:SCREEN_ID,last_seen_at:new Date().toISOString(),updated_at:new Date().toISOString()},{onConflict:"screen_id"});await supabaseClient.from("screens").update({last_seen_at:new Date().toISOString()}).eq("id",SCREEN_ID)}catch(e){}}
function startHeartbeat(){sendHeartbeat();heartbeatTimer=setInterval(sendHeartbeat,30000)}
function startRealtime(){
 realtimeChannel=supabaseClient.channel("screen-live-"+SCREEN_ID)
 .on("postgres_changes",{event:"*",schema:"public",table:"screens",filter:`id=eq.${SCREEN_ID}`},()=>syncFromSupabase())
 .on("postgres_changes",{event:"*",schema:"public",table:"screen_publish_state",filter:`screen_id=eq.${SCREEN_ID}`},()=>syncFromSupabase())
 .on("postgres_changes",{event:"*",schema:"public",table:"playlists",filter:`screen_id=eq.${SCREEN_ID}`},()=>syncFromSupabase())
 .on("postgres_changes",{event:"*",schema:"public",table:"playlist_items"},()=>syncFromSupabase())
 .on("postgres_changes",{event:"*",schema:"public",table:"media"},()=>syncFromSupabase())
 .subscribe();
 realtimeChannel.on?.("system",{},()=>{});
}
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key==="ArrowDown")nextItem();if(e.key==="ArrowLeft"||e.key==="ArrowUp"){currentIndex=Math.max(0,currentIndex-1);playCurrent()}if(e.key===" "){paused=!paused;if(paused){clearTimer();videoEl.pause()}else{playCurrent()}}if(e.key.toLowerCase()==="f"){document.documentElement.requestFullscreen?.()}});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)syncFromSupabase()});
(async function init(){const c=readCache();if(c){screen=c.screen;currentItems=c.items||[];lastContentHash=c.hash||"";if(checkScreen()){applyItems(c.items,c.playlist);firstLoad=false;loadingEl.style.display="none"}}syncTimer=setTimeout(()=>syncFromSupabase(),150);startHeartbeat();startRealtime();setInterval(syncFromSupabase,30000)})();
</script>
</body>
</html>
