<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Screen</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
  overflow:hidden;
  background:#000;
  font-family:Arial,Tahoma,sans-serif;
}

#stage{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

#image,
#video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  opacity:0;
  transition:
    opacity .55s ease,
    transform .55s ease;
  user-select:none;
  -webkit-user-select:none;
  pointer-events:none;
}

#image.cover,
#video.cover{
  object-fit:cover;
}

#image.background,
#video.background{
  object-fit:contain;
}

#overlay{
  position:absolute;
  inset:0;
  z-index:20;
  display:none;
  align-items:center;
  justify-content:center;
  padding:8%;
  text-align:center;
  background:rgba(0,0,0,.88);
  color:#fff;
  font-size:clamp(25px,5vw,75px);
  font-weight:700;
  line-height:1.5;
}

#maintenance{
  position:absolute;
  inset:0;
  z-index:30;
  display:none;
  align-items:center;
  justify-content:center;
  background:#111;
  color:#fff;
  text-align:center;
  font-size:clamp(22px,4vw,60px);
  padding:30px;
}

#countdown{
  display:none !important;
}

#info{
  display:none !important;
}

#offline{
  display:none !important;
}

</style>

</head>


<body>


<div id="stage">

  <img
    id="image"
    alt="">

  <video
    id="video"
    playsinline
    autoplay
    muted>
  </video>

  <div id="overlay"></div>

  <div id="maintenance">
    هذه الشاشة تحت الصيانة
  </div>

  <div id="countdown"></div>

</div>


<div id="info"></div>

<div id="offline">
  الاتصال غير متاح — تشغيل آخر محتوى محفوظ
</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://gkdqttzjwgyfyjbrcbdp.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_QRPg8bjUXtSxRtwBmCguug_cq8ZjbVv";

const STORAGE_BUCKET =
  "signage-media";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth:{
        persistSession:false,
        autoRefreshToken:false,
        detectSessionInUrl:false
      }
    }
  );


/* =====================================================
   SCREEN ID
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


const SCREEN_ID =
  Number(
    params.get("id") || 1
  );


/* =====================================================
   LOCAL CACHE
===================================================== */

const CACHE_KEY =
  "innovationSignageScreenCache_v3_" +
  SCREEN_ID;


/* =====================================================
   ELEMENTS
===================================================== */

const image =
  document.getElementById(
    "image"
  );


const video =
  document.getElementById(
    "video"
  );


const overlay =
  document.getElementById(
    "overlay"
  );


const maintenance =
  document.getElementById(
    "maintenance"
  );


const countdown =
  document.getElementById(
    "countdown"
  );


const info =
  document.getElementById(
    "info"
  );


const offline =
  document.getElementById(
    "offline"
  );


/* =====================================================
   STATE
===================================================== */

let screen = null;

let content = null;

let currentItems = [];

let currentIndex = 0;

let timer = null;

let countdownTimer = null;

let paused = false;

let lastContentHash = "";

let realtimeChannel = null;

let syncing = false;

let heartbeatTimer = null;

let mediaObjectUrls = new Map();


/* =====================================================
   HELPERS
===================================================== */

function sleep(ms){

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}


function safeJsonParse(
  value,
  fallback = null
){

  try{

    return JSON.parse(value);

  }catch(error){

    return fallback;

  }

}


/* =====================================================
   OFFLINE STATUS
===================================================== */

function updateConnectionStatus(){

  /*
    لا نعرض أي حالة اتصال على الشاشة.
  */

}


window.addEventListener(
  "online",
  async ()=>{

    updateConnectionStatus();

    await syncFromSupabase();

  }
);


window.addEventListener(
  "offline",
  ()=>{

    updateConnectionStatus();

  }
);


/* =====================================================
   LOCAL CACHE
===================================================== */

function saveLocalCache(){

  try{

    if(!content)
      return;


    const data = {

      screen:screen,

      content:content,

      savedAt:Date.now()

    };


    localStorage.setItem(
      CACHE_KEY,
      JSON.stringify(data)
    );

  }catch(error){

    console.warn(
      "Cache save failed",
      error
    );

  }

}


function loadLocalCache(){

  try{

    const raw =
      localStorage.getItem(
        CACHE_KEY
      );


    if(!raw)
      return false;


    const data =
      safeJsonParse(
        raw
      );


    if(
      !data ||
      !data.content
    ){

      return false;

    }


    screen =
      data.screen || null;

    content =
      data.content || null;


    return true;

  }catch(error){

    console.warn(
      "Cache load failed",
      error
    );

    return false;

  }

}


/* =====================================================
   HASH
===================================================== */

function getContentHash(){

  return JSON.stringify({

    screenId:
      SCREEN_ID,

    screen:
      screen,

    content:
      content

  });

}


/* =====================================================
   GET SCREEN
===================================================== */

async function loadScreen(){

  const {
    data,
    error
  } =
    await supabaseClient
      .from("screens")
      .select("*")
      .eq(
        "id",
        SCREEN_ID
      )
      .maybeSingle();


  if(error)
    throw error;


  screen =
    data || null;

}


/* =====================================================
   GET PUBLISHED PLAYLIST
===================================================== */

async function loadPublishedContent(){

  const {
    data:publishState,
    error:publishError
  } =
    await supabaseClient
      .from(
        "screen_publish_state"
      )
      .select(
        "screen_id,published_playlist_id,version,published_at"
      )
      .eq(
        "screen_id",
        SCREEN_ID
      )
      .maybeSingle();


  if(publishError)
    throw publishError;


  if(
    !publishState ||
    !publishState.published_playlist_id
  ){

    content = null;

    saveLocalCache();

    return;

  }


  const playlistId =
    publishState.published_playlist_id;


  const {
    data:playlist,
    error:playlistError
  } =
    await supabaseClient
      .from("playlists")
      .select("*")
      .eq(
        "id",
        playlistId
      )
      .maybeSingle();


  if(playlistError)
    throw playlistError;


  if(
    !playlist ||
    playlist.enabled === false
  ){

    content = null;

    saveLocalCache();

    return;

  }


  const {
    data:items,
    error:itemsError
  } =
    await supabaseClient
      .from("playlist_items")
      .select(`
        id,
        playlist_id,
        media_id,
        position,
        enabled,
        duration,
        transition,
        video_mode,
        muted,
        created_at,
        updated_at,
        media:media_id (
          id,
          name,
          type,
          file_path,
          file_url,
          file_size,
          width,
          height,
          duration,
          tags,
          enabled,
          created_at,
          updated_at
        )
      `)
      .eq(
        "playlist_id",
        playlistId
      )
      .order(
        "position",
        {
          ascending:true
        }
      );


  if(itemsError)
    throw itemsError;


  const normalizedItems =
    (items || [])
      .filter(
        item =>
          item.enabled !== false &&
          item.media &&
          item.media.enabled !== false &&
          item.media.file_url
      )
      .map(
        item => ({

          id:
            item.id,

          mediaId:
            item.media_id,

          type:
            item.media.type,

          name:
            item.media.name,

          url:
            item.media.file_url,

          filePath:
            item.media.file_path,

          duration:
            Number(
              item.duration
              ||
              item.media.duration
              ||
              playlist.default_duration
              ||
              10
            ),

          transition:
            item.transition
            ||
            playlist.default_transition
            ||
            "fade",

          mode:
            item.video_mode
            ||
            "next",

          muted:
            item.muted !== false,

          width:
            item.media.width,

          height:
            item.media.height

        })
      );


  content = {

    playlistId:
      playlist.id,

    name:
      playlist.name,

    repeatAll:
      playlist.repeat_all !== false,

    defaultDuration:
      Number(
        playlist.default_duration
        ||
        10
      ),

    defaultTransition:
      playlist.default_transition
      ||
      "fade",

    fitMode:
      playlist.fit_mode
      ||
      "contain",

    publishedAt:
      publishState.published_at,

    version:
      publishState.version,

    items:
      normalizedItems

  };


  saveLocalCache();

}


/* =====================================================
   SUPABASE SYNC
===================================================== */

async function syncFromSupabase(
  showMessages = false
){

  if(syncing)
    return;


  if(!navigator.onLine)
    return;


  syncing = true;


  try{

    await loadScreen();

    await loadPublishedContent();


    if(
      !checkScreen()
    ){

      syncing = false;

      return;

    }


    const newHash =
      getContentHash();


    if(
      newHash !==
      lastContentHash
    ){

      lastContentHash =
        newHash;


      currentIndex =
        0;


      playCurrent();

    }


    await sendHeartbeat();


  }catch(error){

    console.error(
      "Supabase sync error:",
      error
    );


    if(
      !content
    ){

      if(
        loadLocalCache()
      ){

        lastContentHash =
          getContentHash();


        currentIndex =
          0;


        playCurrent();

      }

    }

    updateConnectionStatus();

  }finally{

    syncing = false;

  }

}


/* =====================================================
   SCREEN STATUS
===================================================== */

function checkScreen(){

  if(!screen){

    maintenance.style.display =
      "flex";

    maintenance.textContent =
      "الشاشة غير موجودة";

    return false;

  }


  if(
    screen.enabled === false
  ){

    maintenance.style.display =
      "flex";

    maintenance.textContent =
      "هذه الشاشة غير مفعلة";

    return false;

  }


  if(
    screen.maintenance_mode === true
  ){

    maintenance.style.display =
      "flex";

    maintenance.textContent =
      "هذه الشاشة تحت الصيانة";

    return false;

  }


  maintenance.style.display =
    "none";


  return true;

}


/* =====================================================
   ACTIVE ITEMS
===================================================== */

function getActiveItems(){

  if(!content)
    return [];


  return (
    content.items || []
  )
  .filter(
    item =>
      item &&
      item.url
  );

}


/* =====================================================
   CLEAR TIMERS
===================================================== */

function clearTimers(){

  clearTimeout(
    timer
  );


  clearInterval(
    countdownTimer
  );


  timer =
    null;

  countdownTimer =
    null;

}


/* =====================================================
   RESET MEDIA
===================================================== */

function resetMedia(){

  clearTimers();


  countdown.style.display =
    "none";


  image.style.opacity =
    "0";

  video.style.opacity =
    "0";


  video.pause();

}


/* =====================================================
   TRANSITION
===================================================== */

function applyTransition(
  transition
){

  image.style.transform =
    "translateX(0) scale(1)";

  video.style.transform =
    "translateX(0) scale(1)";


  image.style.opacity =
    "0";

  video.style.opacity =
    "0";


  if(
    transition === "none"
  ){

    setTimeout(
      ()=>{

        image.style.opacity =
          "1";

        video.style.opacity =
          "1";

      },
      20
    );

    return;

  }


  if(
    transition === "slide"
  ){

    image.style.transform =
      "translateX(35px)";

    video.style.transform =
      "translateX(35px)";

  }


  if(
    transition === "zoom"
  ){

    image.style.transform =
      "scale(1.06)";

    video.style.transform =
      "scale(1.06)";

  }


  setTimeout(
    ()=>{

      image.style.opacity =
        "1";

      video.style.opacity =
        "1";

      image.style.transform =
        "translateX(0) scale(1)";

      video.style.transform =
        "translateX(0) scale(1)";

    },
    80
  );

}


/* =====================================================
   COUNTDOWN
===================================================== */

function startCountdown(
  seconds
){

  clearInterval(
    countdownTimer
  );


  /*
    العداد يعمل داخليًا فقط
    بدون ظهوره على الشاشة.
  */

  countdown.style.display =
    "none";


  const duration =
    Math.max(
      1,
      Number(seconds) || 10
    );


  const endTime =
    Date.now()
    +
    duration * 1000;


  function update(){

    const remaining =
      Math.max(
        0,
        Math.ceil(
          (
            endTime -
            Date.now()
          ) / 1000
        )
      );


    if(
      remaining <= 0
    ){

      clearInterval(
        countdownTimer
      );

    }

  }


  update();


  countdownTimer =
    setInterval(
      update,
      200
    );

}


/* =====================================================
   MEDIA CACHE
===================================================== */

async function cacheMedia(
  item
){

  if(
    !item ||
    !item.url
  )
    return;


  if(
    !("caches" in window)
  )
    return;


  try{

    const cache =
      await caches.open(
        "innovation-signage-media-v1"
      );


    const existing =
      await cache.match(
        item.url
      );


    if(existing)
      return;


    const response =
      await fetch(
        item.url,
        {
          mode:"cors",
          cache:"no-store"
        }
      );


    if(
      response.ok
    ){

      await cache.put(
        item.url,
        response.clone()
      );

    }

  }catch(error){

    console.warn(
      "Media cache failed:",
      item.url,
      error
    );

  }

}


/* =====================================================
   PRELOAD MEDIA
===================================================== */

async function preloadMedia(){

  const items =
    getActiveItems();


  if(!items.length)
    return;


  if(
    !navigator.onLine
  )
    return;


  for(
    const item of items
  ){

    cacheMedia(item);

  }

}


/* =====================================================
   GET OFFLINE MEDIA URL
===================================================== */

async function getOfflineMediaUrl(
  url
){

  if(
    !("caches" in window)
  )
    return null;


  try{

    const cache =
      await caches.open(
        "innovation-signage-media-v1"
      );


    const response =
      await cache.match(
        url
      );


    if(!response)
      return null;


    const blob =
      await response.blob();


    const objectUrl =
      URL.createObjectURL(
        blob
      );


    mediaObjectUrls.set(
      objectUrl,
      true
    );


    return objectUrl;

  }catch(error){

    console.warn(
      "Offline media error:",
      error
    );

    return null;

  }

}


/* =====================================================
   RESOLVE MEDIA URL
===================================================== */

async function resolveMediaUrl(
  item
){

  if(
    navigator.onLine
  ){

    cacheMedia(item);

    return item.url;

  }


  const cachedUrl =
    await getOfflineMediaUrl(
      item.url
    );


  return (
    cachedUrl ||
    item.url
  );

}


/* =====================================================
   PLAY IMAGE
===================================================== */

async function playImage(
  item
){

  video.pause();

  video.removeAttribute(
    "src"
  );


  video.load();


  video.style.display =
    "none";

  image.style.display =
    "block";


  image.className =
    "";


  if(
    content.fitMode ===
    "cover"
  ){

    image.classList.add(
      "cover"
    );

  }


  if(
    content.fitMode ===
    "background"
  ){

    image.classList.add(
      "background"
    );

  }


  const mediaUrl =
    await resolveMediaUrl(
      item
    );


  if(
    currentItems[currentIndex] !==
    item
  ){

    return;

  }


  image.src =
    mediaUrl;


  applyTransition(
    item.transition
    ||
    content.defaultTransition
    ||
    "fade"
  );


  const duration =
    Math.max(
      1,
      Number(
        item.duration
        ||
        content.defaultDuration
        ||
        10
      )
    );


  startCountdown(
    duration
  );


  timer =
    setTimeout(
      ()=>{

        nextItem();

      },
      duration * 1000
    );

}


/* =====================================================
   PLAY VIDEO
===================================================== */

async function playVideo(
  item
){

  image.style.display =
    "none";


  video.style.display =
    "block";


  video.className =
    "";


  if(
    content.fitMode ===
    "cover"
  ){

    video.classList.add(
      "cover"
    );

  }


  if(
    content.fitMode ===
    "background"
  ){

    video.classList.add(
      "background"
    );

  }


  video.pause();


  video.removeAttribute(
    "src"
  );


  video.load();


  const mediaUrl =
    await resolveMediaUrl(
      item
    );


  if(
    currentItems[currentIndex] !==
    item
  ){

    return;

  }


  video.src =
    mediaUrl;


  video.currentTime =
    0;


  video.muted =
    item.muted !== false;


  video.loop =
    item.mode === "loop";


  applyTransition(
    item.transition
    ||
    content.defaultTransition
    ||
    "fade"
  );


  countdown.style.display =
    "none";


  video.onended =
    ()=>{

      if(
        !video.loop
      ){

        nextItem();

      }

    };


  video.onerror =
    ()=>{

    };


  video.play()
    .catch(
      ()=>{

      }
    );

}


/* =====================================================
   PLAY CURRENT
===================================================== */

function playCurrent(){

  clearTimers();


  currentItems =
    getActiveItems();


  if(
    !currentItems.length
  ){

    resetMedia();


    image.style.display =
      "none";

    video.style.display =
      "none";


    maintenance.style.display =
      "flex";


    maintenance.textContent =
      "لا يوجد محتوى منشور لهذه الشاشة";


    return;

  }


  maintenance.style.display =
    "none";


  if(
    currentIndex >=
    currentItems.length
  ){

    currentIndex =
      0;

  }


  const item =
    currentItems[
      currentIndex
    ];


  if(
    item.type ===
    "video"
  ){

    playVideo(item);

  }else{

    playImage(item);

  }

}


/* =====================================================
   NEXT
===================================================== */

function nextItem(){

  if(paused)
    return;


  currentItems =
    getActiveItems();


  if(
    !currentItems.length
  )
    return;


  currentIndex++;


  if(
    currentIndex >=
    currentItems.length
  ){

    if(
      content.repeatAll !==
      false
    ){

      currentIndex =
        0;

    }else{

      currentIndex =
        currentItems.length - 1;

      return;

    }

  }


  playCurrent();

}


/* =====================================================
   PREVIOUS
===================================================== */

function previousItem(){

  currentItems =
    getActiveItems();


  if(
    !currentItems.length
  )
    return;


  currentIndex--;


  if(
    currentIndex < 0
  ){

    currentIndex =
      currentItems.length - 1;

  }


  playCurrent();

}


/* =====================================================
   HEARTBEAT
===================================================== */

async function sendHeartbeat(){

  if(
    !navigator.onLine
  )
    return;


  try{

    const browser =
      navigator.userAgent
        .slice(
          0,
          500
        );


    const {
      error
    } =
      await supabaseClient
        .from(
          "screen_heartbeats"
        )
        .upsert(
          {
            screen_id:
              SCREEN_ID,

            last_seen_at:
              new Date()
                .toISOString(),

            browser:
              browser,

            updated_at:
              new Date()
                .toISOString()
          },
          {
            onConflict:
              "screen_id"
          }
        );


    if(error){

      console.warn(
        "Heartbeat error:",
        error
      );

    }

  }catch(error){

    console.warn(
      "Heartbeat failed:",
      error
    );

  }

}


/* =====================================================
   HEARTBEAT LOOP
===================================================== */

function startHeartbeat(){

  clearInterval(
    heartbeatTimer
  );


  sendHeartbeat();


  heartbeatTimer =
    setInterval(
      sendHeartbeat,
      30000
    );

}


/* =====================================================
   REALTIME
===================================================== */

function setupRealtime(){

  if(
    realtimeChannel
  ){

    supabaseClient
      .removeChannel(
        realtimeChannel
      );

  }


  realtimeChannel =
    supabaseClient
      .channel(
        "screen-" +
        SCREEN_ID +
        "-realtime"
      );


  realtimeChannel
    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"screen_publish_state",
        filter:
          "screen_id=eq." +
          SCREEN_ID
      },
      ()=>{
        syncFromSupabase();
      }
    )
    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"screens",
        filter:
          "id=eq." +
          SCREEN_ID
      },
      ()=>{
        syncFromSupabase();
      }
    )
    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"playlists"
      },
      ()=>{
        syncFromSupabase();
      }
    )
    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"playlist_items"
      },
      ()=>{
        syncFromSupabase();
      }
    )
    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"media"
      },
      ()=>{
        syncFromSupabase();
      }
    )
    .subscribe(
      status=>{

        console.log(
          "Realtime:",
          status
        );

      }
    );

}


/* =====================================================
   PERIODIC SYNC
===================================================== */

setInterval(
  ()=>{
    syncFromSupabase();
  },
  30000
);


/* =====================================================
   INFO
===================================================== */

function showInfo(
  message
){

  /*
    معطلة عمدًا.
    الشاشة لا تعرض أي رسائل أثناء التشغيل.
  */

  return;

}


/* =====================================================
   FULLSCREEN
===================================================== */

function goFullscreen(){

  if(
    document.documentElement
      .requestFullscreen
  ){

    document.documentElement
      .requestFullscreen()
      .catch(
        ()=>{}
      );

  }

}


/* =====================================================
   KEYBOARD CONTROLS
===================================================== */

document.addEventListener(
  "keydown",
  event=>{

    if(
      event.key ===
      " "
    ){

      event.preventDefault();


      paused =
        !paused;


      if(paused){

        clearTimers();

        video.pause();

      }else{

        playCurrent();

      }

    }


    if(
      event.key ===
      "ArrowRight"
    ){

      nextItem();

    }


    if(
      event.key ===
      "ArrowLeft"
    ){

      previousItem();

    }


    if(
      event.key ===
      "f" ||
      event.key ===
      "F"
    ){

      goFullscreen();

    }

  }
);


/* =====================================================
   DOUBLE CLICK
===================================================== */

document.body.addEventListener(
  "dblclick",
  ()=>{
    goFullscreen();
  }
);


/* =====================================================
   CLICK TO ENABLE VIDEO
===================================================== */

document.body.addEventListener(
  "click",
  ()=>{

    if(
      video.paused &&
      video.src
    ){

      video.play()
        .catch(
          ()=>{}
        );

    }

  }
);


/* =====================================================
   INITIALIZATION
===================================================== */

async function initialize(){

  updateConnectionStatus();


  /*
    تشغيل آخر نسخة محفوظة
    مباشرة عند فتح الشاشة.
  */

  const cached =
    loadLocalCache();


  if(cached){

    lastContentHash =
      getContentHash();


    if(
      checkScreen()
    ){

      currentIndex =
        0;

      playCurrent();

    }

  }


  /*
    جلب أحدث محتوى من Supabase.
  */

  if(
    navigator.onLine
  ){

    await syncFromSupabase();

  }else if(!cached){

    maintenance.style.display =
      "flex";

    maintenance.textContent =
      "لا يوجد اتصال ولا يوجد محتوى محفوظ";

  }


  /*
    Realtime
  */

  setupRealtime();


  /*
    Heartbeat
  */

  startHeartbeat();


  /*
    تخزين ملفات الوسائط
    للاستخدام عند انقطاع الإنترنت.
  */

  preloadMedia();

}


/* =====================================================
   START
===================================================== */

window.addEventListener(
  "load",
  initialize
);

</script>
