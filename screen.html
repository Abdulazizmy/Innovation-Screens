<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>الشاشة</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:Arial,"Tahoma",sans-serif;
}

body{
  user-select:none;
}

#stage{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  background:#000;
  overflow:hidden;
}

#image{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  display:none;
  background:#000;
}

#video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  display:none;
  background:#000;
}

#overlay{
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:0;
  background:#000;
  z-index:10;
}

#maintenance{
  position:absolute;
  inset:0;
  z-index:30;
  background:
    radial-gradient(
      circle at center,
      #171124 0,
      #050407 65%
    );
  display:none;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px;
}

.maintenance-box{
  max-width:700px;
}

.maintenance-icon{
  width:90px;
  height:90px;
  border-radius:25px;
  margin:0 auto 25px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#1d1730;
  border:1px solid #33294b;
  font-size:38px;
}

.maintenance-title{
  font-size:30px;
  font-weight:bold;
  margin-bottom:12px;
}

.maintenance-text{
  color:#9d96aa;
  font-size:16px;
  line-height:1.7;
}

#offline{
  position:absolute;
  left:15px;
  bottom:15px;
  z-index:100;
  padding:7px 10px;
  border-radius:7px;
  background:#1b1012;
  border:1px solid #4b2226;
  color:#ff9b9b;
  font-size:10px;
  display:none;
}

#screenInfo{
  position:absolute;
  top:12px;
  left:12px;
  z-index:100;
  background:#000a;
  color:#aaa;
  padding:7px 9px;
  border-radius:7px;
  font-size:9px;
  display:none;
}

.fade-in{
  animation:fadeIn .6s ease forwards;
}

.fade-out{
  animation:fadeOut .6s ease forwards;
}

.slide-in{
  animation:slideIn .6s ease forwards;
}

.zoom-in{
  animation:zoomIn .6s ease forwards;
}

@keyframes fadeIn{
  from{opacity:0}
  to{opacity:1}
}

@keyframes fadeOut{
  from{opacity:1}
  to{opacity:0}
}

@keyframes slideIn{
  from{
    opacity:0;
    transform:translateX(80px);
  }
  to{
    opacity:1;
    transform:translateX(0);
  }
}

@keyframes zoomIn{
  from{
    opacity:0;
    transform:scale(1.08);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

</style>

</head>

<body>

<div id="stage">

  <img
    id="image"
    alt="">

  <video
    id="video"
    playsinline
    muted
    preload="auto">
  </video>

  <div id="overlay"></div>

  <div id="maintenance">

    <div class="maintenance-box">

      <div
        class="maintenance-icon"
        id="maintenanceIcon">
        ⏹
      </div>

      <div
        class="maintenance-title"
        id="maintenanceTitle">
        هذه الشاشة غير مفعلة
      </div>

      <div
        class="maintenance-text"
        id="maintenanceText">
        تم إيقاف هذه الشاشة من لوحة التحكم.
      </div>

    </div>

  </div>

  <div id="offline">
    لا يوجد اتصال بالخادم
  </div>

  <div id="screenInfo"></div>

</div>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://gkdqttzjwgyfyjbrcbdp.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_QRPg8bjUXtSxRtwBmCguug_cq8ZjbVv";

const STORAGE_BUCKET =
  "signage-media";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

/* =========================================================
   SCREEN ID
========================================================= */

const params =
  new URLSearchParams(
    window.location.search
  );

const SCREEN_ID =
  Number(
    params.get("id") || 1
  );

/* =========================================================
   ELEMENTS
========================================================= */

const image =
  document.getElementById(
    "image"
  );

const video =
  document.getElementById(
    "video"
  );

const overlay =
  document.getElementById(
    "overlay"
  );

const maintenance =
  document.getElementById(
    "maintenance"
  );

const maintenanceTitle =
  document.getElementById(
    "maintenanceTitle"
  );

const maintenanceText =
  document.getElementById(
    "maintenanceText"
  );

const offline =
  document.getElementById(
    "offline"
  );

const screenInfo =
  document.getElementById(
    "screenInfo"
  );

/* =========================================================
   STATE
========================================================= */

let screen = null;

let content = null;

let currentItems = [];

let currentIndex = 0;

let timer = null;

let paused = false;

let lastContentHash = "";

let realtimeChannel = null;

let syncing = false;

let heartbeatTimer = null;

let mediaObjectUrls = new Set();

let firstLoad = true;

/* =========================================================
   CACHE
========================================================= */

const CACHE_KEY =
  "innovationSignageScreenCache_v4_" +
  SCREEN_ID;

function saveLocalCache(){

  try{

    localStorage.setItem(
      CACHE_KEY,
      JSON.stringify({
        screen,
        content,
        savedAt:
          Date.now()
      })
    );

  }catch(error){

    console.warn(
      "Cache save error",
      error
    );
  }
}

function loadLocalCache(){

  try{

    const raw =
      localStorage.getItem(
        CACHE_KEY
      );

    if(!raw)
      return null;

    return JSON.parse(raw);

  }catch{

    return null;
  }
}

/* =========================================================
   HELPERS
========================================================= */

function hashContent(data){

  try{

    return JSON.stringify(
      data
    );

  }catch{

    return String(
      Date.now()
    );
  }
}

function sleep(ms){

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );
}

function clearPlaybackTimer(){

  if(timer){

    clearTimeout(timer);
    timer = null;
  }
}

function hideAllMedia(){

  image.style.display =
    "none";

  video.style.display =
    "none";

  video.pause();
}

function getFitMode(){

  return (
    content?.fitMode ||
    "contain"
  );
}

function applyFitMode(){

  const mode =
    getFitMode();

  const objectFit =
    mode === "cover"
      ? "cover"
      : "contain";

  image.style.objectFit =
    objectFit;

  video.style.objectFit =
    objectFit;

  if(mode === "background"){

    image.style.objectFit =
      "cover";

    video.style.objectFit =
      "cover";
  }
}

/* =========================================================
   SCREEN
========================================================= */

async function loadScreen(){

  const {
    data,
    error
  } = await supabaseClient
    .from("screens")
    .select("*")
    .eq(
      "id",
      SCREEN_ID
    )
    .maybeSingle();

  if(error)
    throw error;

  screen = data;

  if(screen){

    screenInfo.textContent =
      `${screen.name || ""} · #${SCREEN_ID}`;

    screenInfo.style.display =
      "block";
  }

  checkScreen();
}

function checkScreen(){

  if(!screen){

    showMaintenance(
      "الشاشة غير موجودة",
      "لم يتم العثور على الشاشة المطلوبة."
    );

    return false;
  }

  if(screen.enabled === false){

    showMaintenance(
      "هذه الشاشة غير مفعلة",
      "تم إيقاف هذه الشاشة من لوحة التحكم."
    );

    clearPlaybackTimer();
    hideAllMedia();

    return false;
  }

  if(
    screen.maintenance_mode === true
  ){

    showMaintenance(
      "الشاشة تحت الصيانة",
      "هذه الشاشة في وضع الصيانة حاليًا."
    );

    clearPlaybackTimer();
    hideAllMedia();

    return false;
  }

  hideMaintenance();

  return true;
}

function showMaintenance(
  title,
  text
){

  maintenanceTitle.textContent =
    title;

  maintenanceText.textContent =
    text;

  maintenance.style.display =
    "flex";
}

function hideMaintenance(){

  maintenance.style.display =
    "none";
}

/* =========================================================
   PUBLISHED CONTENT
========================================================= */

async function getPublishedPlaylistId(){

  /*
    المصدر الأساسي:
    screen_publish_state
  */

  const stateResult =
    await supabaseClient
      .from(
        "screen_publish_state"
      )
      .select(
        "screen_id,published_playlist_id,version,published_at"
      )
      .eq(
        "screen_id",
        SCREEN_ID
      )
      .maybeSingle();

  if(
    !stateResult.error &&
    stateResult.data?.published_playlist_id
  ){

    return {
      playlistId:
        Number(
          stateResult.data
            .published_playlist_id
        ),

      version:
        stateResult.data.version ||
        null,

      publishedAt:
        stateResult.data.published_at ||
        null
    };
  }

  /*
    fallback:
    playlists.published
  */

  const fallback =
    await supabaseClient
      .from("playlists")
      .select("*")
      .eq(
        "screen_id",
        SCREEN_ID
      )
      .eq(
        "published",
        true
      )
      .order(
        "id",
        {
          ascending:false
        }
      )
      .limit(1)
      .maybeSingle();

  if(fallback.error)
    throw fallback.error;

  if(!fallback.data){

    return {
      playlistId:null,
      version:null,
      publishedAt:null
    };
  }

  return {
    playlistId:
      Number(
        fallback.data.id
      ),

    version:null,

    publishedAt:
      fallback.data.updated_at ||
      fallback.data.created_at ||
      null
  };
}

async function loadPublishedContent(){

  const published =
    await getPublishedPlaylistId();

  if(!published.playlistId){

    content = null;
    currentItems = [];

    saveLocalCache();

    return false;
  }

  const playlistResult =
    await supabaseClient
      .from("playlists")
      .select("*")
      .eq(
        "id",
        published.playlistId
      )
      .maybeSingle();

  if(playlistResult.error)
    throw playlistResult.error;

  if(!playlistResult.data){

    content = null;
    currentItems = [];

    saveLocalCache();

    return false;
  }

  const playlist =
    playlistResult.data;

  const itemsResult =
    await supabaseClient
      .from("playlist_items")
      .select(
        `*,
         media:media_id(*)`
      )
      .eq(
        "playlist_id",
        playlist.id
      )
      .order(
        "position",
        {
          ascending:true
        }
      );

  if(itemsResult.error)
    throw itemsResult.error;

  const rawItems =
    itemsResult.data || [];

  currentItems =
    rawItems
      .filter(
        item =>
          item.enabled !== false &&
          item.media &&
          item.media.enabled !== false
      )
      .map(item=>{

        let duration;

        /*
          duration = 0
          يعني صورة ثابتة
        */

        if(
          item.duration !== null &&
          item.duration !== undefined
        ){

          duration =
            Number(
              item.duration
            );

        }else{

          duration =
            Number(
              playlist.default_duration
            );
        }

        if(
          !Number.isFinite(
            duration
          )
        ){

          duration = 10;
        }

        return {

          ...item,

          duration,

          transition:
            item.transition ||
            playlist.default_transition ||
            "fade",

          media:
            item.media,

          videoMode:
            item.video_mode ||
            "next",

          muted:
            item.muted !== false

        };
      });

  content = {

    playlistId:
      Number(playlist.id),

    name:
      playlist.name || "",

    repeatAll:
      playlist.repeat_all !== false,

    defaultDuration:
      playlist.default_duration,

    defaultTransition:
      playlist.default_transition ||
      "fade",

    fitMode:
      playlist.fit_mode ||
      "contain",

    publishedAt:
      published.publishedAt,

    version:
      published.version,

    items:
      currentItems

  };

  saveLocalCache();

  return true;
}

/* =========================================================
   CACHE FALLBACK
========================================================= */

function loadCachedState(){

  const cached =
    loadLocalCache();

  if(!cached)
    return false;

  if(cached.screen){

    screen =
      cached.screen;
  }

  if(cached.content){

    content =
      cached.content;

    currentItems =
      cached.content.items ||
      [];
  }

  return true;
}

/* =========================================================
   PLAYBACK
========================================================= */

function getTransition(
  item
){

  return (
    item?.transition ||
    content?.defaultTransition ||
    "fade"
  );
}

function applyTransition(
  element,
  transition
){

  element.classList.remove(
    "fade-in",
    "fade-out",
    "slide-in",
    "zoom-in"
  );

  void element.offsetWidth;

  if(transition === "fade")
    element.classList.add(
      "fade-in"
    );

  if(transition === "slide")
    element.classList.add(
      "slide-in"
    );

  if(transition === "zoom")
    element.classList.add(
      "zoom-in"
    );
}

async function playCurrent(){

  clearPlaybackTimer();

  if(!checkScreen())
    return;

  if(!currentItems.length){

    hideAllMedia();

    return;
  }

  if(
    currentIndex < 0 ||
    currentIndex >= currentItems.length
  ){

    currentIndex = 0;
  }

  const item =
    currentItems[
      currentIndex
    ];

  if(!item?.media)
    return;

  applyFitMode();

  const media =
    item.media;

  const transition =
    getTransition(item);

  hideAllMedia();

  if(media.type === "image"){

    image.src =
      media.file_url;

    image.style.display =
      "block";

    applyTransition(
      image,
      transition
    );

    /*
      duration = 0
      = صورة ثابتة
    */

    if(
      Number(item.duration) > 0
    ){

      timer =
        setTimeout(
          nextItem,
          Number(item.duration) *
            1000
        );
    }

    return;
  }

  if(media.type === "video"){

    video.src =
      media.file_url;

    video.muted =
      item.muted !== false;

    video.currentTime = 0;

    video.style.display =
      "block";

    applyTransition(
      video,
      transition
    );

    video.onended =
      ()=>{

        if(item.videoMode === "loop"){

          video.currentTime = 0;

          video.play()
            .catch(()=>{});

          return;
        }

        nextItem();
      };

    try{

      await video.play();

    }catch{

      /*
        بعض المتصفحات تمنع
        autoplay.
        سننتظر التفاعل.
      */

      document.addEventListener(
        "click",
        enableVideoOnce,
        {
          once:true
        }
      );
    }

    return;
  }
}

function enableVideoOnce(){

  video.muted = true;

  video.play()
    .catch(()=>{});
}

function nextItem(){

  if(!currentItems.length)
    return;

  const current =
    currentItems[
      currentIndex
    ];

  /*
    صورة ثابتة لا تنتقل تلقائيًا.
  */

  if(
    current?.media?.type === "image" &&
    Number(current.duration) === 0
  ){

    return;
  }

  currentIndex++;

  if(
    currentIndex >=
    currentItems.length
  ){

    if(
      content?.repeatAll !== false
    ){

      currentIndex = 0;

    }else{

      currentIndex =
        currentItems.length - 1;

      return;
    }
  }

  playCurrent();
}

/* =========================================================
   SYNC
========================================================= */

async function syncFromSupabase(){

  if(syncing)
    return;

  syncing = true;

  try{

    await loadScreen();

    if(!screen)
      return;

    if(!checkScreen())
      return;

    const oldHash =
      lastContentHash;

    await loadPublishedContent();

    const newHash =
      hashContent(
        content
      );

    if(
      firstLoad ||
      oldHash !== newHash
    ){

      currentIndex = 0;

      lastContentHash =
        newHash;

      await playCurrent();

      firstLoad = false;
    }

    offline.style.display =
      "none";

    await sendHeartbeat();

  }catch(error){

    console.error(
      "Sync error:",
      error
    );

    /*
      إذا انقطع Supabase:
      نحاول تشغيل آخر محتوى محفوظ.
    */

    if(!screen){

      loadCachedState();

    }else{

      const cached =
        loadLocalCache();

      if(cached?.content){

        content =
          cached.content;

        currentItems =
          cached.content.items ||
          [];

      }
    }

    if(
      currentItems.length &&
      checkScreen()
    ){

      if(!lastContentHash){

        lastContentHash =
          hashContent(
            content
          );

        playCurrent();
      }
    }

    offline.style.display =
      "block";

  }finally{

    syncing = false;
  }
}

/* =========================================================
   HEARTBEAT
========================================================= */

async function sendHeartbeat(){

  const now =
    new Date().toISOString();

  /*
    نحافظ على جدول heartbeat
    إذا كان موجودًا.
  */

  try{

    const heartbeat =
      await supabaseClient
        .from(
          "screen_heartbeats"
        )
        .upsert(
          {
            screen_id:
              SCREEN_ID,

            last_seen_at:
              now,

            browser:
              navigator.userAgent,

            updated_at:
              now
          },
          {
            onConflict:
              "screen_id"
          }
        );

    if(heartbeat.error){

      console.warn(
        "Heartbeat table:",
        heartbeat.error
      );
    }

  }catch(error){

    console.warn(
      "Heartbeat error:",
      error
    );
  }

  /*
    الأهم:
    تحديث last_seen_at في screens
    حتى لوحة التحكم تعرف أن الشاشة Online.
  */

  try{

    const screenUpdate =
      await supabaseClient
        .from("screens")
        .update({
          last_seen_at:now
        })
        .eq(
          "id",
          SCREEN_ID
        );

    if(screenUpdate.error){

      console.warn(
        "Screen heartbeat update:",
        screenUpdate.error
      );
    }

  }catch(error){

    console.warn(
      "Screen heartbeat update error:",
      error
    );
  }
}

function startHeartbeat(){

  if(heartbeatTimer)
    clearInterval(
      heartbeatTimer
    );

  sendHeartbeat();

  heartbeatTimer =
    setInterval(
      sendHeartbeat,
      30000
    );
}

/* =========================================================
   REALTIME
========================================================= */

function startRealtime(){

  if(realtimeChannel){

    supabaseClient.removeChannel(
      realtimeChannel
    );
  }

  realtimeChannel =
    supabaseClient
      .channel(
        "screen-" +
        SCREEN_ID
      )

      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"screens",
          filter:
            `id=eq.${SCREEN_ID}`
        },
        async ()=>{
          await syncFromSupabase();
        }
      )

      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"screen_publish_state",
          filter:
            `screen_id=eq.${SCREEN_ID}`
        },
        async ()=>{
          await syncFromSupabase();
        }
      )

      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"playlists"
        },
        async payload=>{

          const row =
            payload.new ||
            payload.old;

          if(
            row &&
            Number(row.screen_id) ===
            SCREEN_ID
          ){

            await syncFromSupabase();
          }
        }
      )

      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"playlist_items"
        },
        async ()=>{

          await syncFromSupabase();
        }
      )

      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"media"
        },
        async ()=>{

          await syncFromSupabase();
        }
      )

      .subscribe();
}

/* =========================================================
   PERIODIC SYNC
========================================================= */

setInterval(
  ()=>{
    syncFromSupabase();
  },
  30000
);

/* =========================================================
   KEYBOARD / FULLSCREEN
========================================================= */

document.addEventListener(
  "keydown",
  event=>{

    if(event.key === "ArrowRight"){

      currentIndex++;

      if(
        currentIndex >=
        currentItems.length
      ){

        currentIndex = 0;
      }

      playCurrent();
    }

    if(event.key === "ArrowLeft"){

      currentIndex--;

      if(currentIndex < 0){

        currentIndex =
          Math.max(
            currentItems.length - 1,
            0
          );
      }

      playCurrent();
    }

    if(event.key === " "){

      event.preventDefault();

      if(
        video.style.display !==
        "none"
      ){

        if(video.paused)
          video.play().catch(()=>{});
        else
          video.pause();
      }

    }

    if(
      event.key.toLowerCase() ===
      "f"
    ){

      toggleFullscreen();
    }
  }
);

async function toggleFullscreen(){

  try{

    if(!document.fullscreenElement){

      await document.documentElement
        .requestFullscreen();

    }else{

      await document.exitFullscreen();
    }

  }catch(error){

    console.warn(
      "Fullscreen error:",
      error
    );
  }
}

/* =========================================================
   VISIBILITY
========================================================= */

document.addEventListener(
  "visibilitychange",
  ()=>{

    if(
      document.visibilityState ===
      "visible"
    ){

      syncFromSupabase();
    }
  }
);

/* =========================================================
   INITIALIZATION
========================================================= */

async function init(){

  /*
    نشغل آخر نسخة محفوظة
    بسرعة أثناء انتظار Supabase.
  */

  loadCachedState();

  if(screen){

    checkScreen();
  }

  if(currentItems.length){

    lastContentHash =
      hashContent(
        content
      );

    playCurrent();
  }

  startHeartbeat();

  startRealtime();

  await syncFromSupabase();
}

init();

</script>
